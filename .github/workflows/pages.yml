# Runs the tests, then publishes the overlay to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy overlay to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html main.js core bridges net renderer ui games sounds _site/
      # The Android app's over-the-air updates: the same files the APK ships (Three.js bundled,
      # local bridge default) plus version.json and files.json with SHA-256 checksums.
      # Phones only switch to them when package.json's version is newer than theirs.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app bundle (/app/)
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node build-www.mjs
          cp -r www ../_site/app
      - uses: actions/configure-pages@v5
      # The artifact name includes the attempt number: artifacts from a failed first attempt stay
      # attached to the run, and "Re-run" would otherwise find two artifacts with the same name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # Right after the upload, GitHub sometimes can't find the artifact yet ("No artifacts named
      # github-pages were found"). Wait a bit and try once more before failing.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
