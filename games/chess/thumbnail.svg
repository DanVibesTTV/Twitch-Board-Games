<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2e"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19e6ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="200" fill="url(#sky)"/>
  <!-- skyline -->
  <g fill="#0c0e1a">
    <rect x="8" y="40" width="34" height="90"/><rect x="48" y="20" width="28" height="110"/>
    <rect x="240" y="30" width="30" height="100"/><rect x="276" y="52" width="36" height="78"/>
  </g>
  <g fill="#19e6ff" opacity=".55"><rect x="14" y="50" width="5" height="7"/><rect x="26" y="66" width="5" height="7"/><rect x="54" y="34" width="5" height="7"/><rect x="64" y="58" width="5" height="7"/></g>
  <g fill="#ff2bd6" opacity=".55"><rect x="248" y="44" width="5" height="7"/><rect x="258" y="70" width="5" height="7"/><rect x="284" y="62" width="5" height="7"/><rect x="298" y="84" width="5" height="7"/></g>
  <!-- board in perspective -->
  <g transform="translate(160 150)">
    <polygon points="-120,40 120,40 80,-30 -80,-30" fill="#0b0f1e" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
    <g fill="#26304a">
      <polygon points="-110,31 -80,31 -59,-21 -70,-21"/><polygon points="-50,31 -20,31 -15,-21 -38,-21"/>
      <polygon points="10,31 40,31 30,-21 8,-21"/><polygon points="70,31 100,31 74,-21 52,-21"/>
    </g>
  </g>
  <!-- pieces: overlord (cyan) vs assassin (magenta) -->
  <g filter="url(#glow)">
    <path d="M100 150 L94 112 L100 92 L106 112 Z M92 150 h16 l-4 -38 h-8 Z" fill="#1a1d2c" stroke="#19e6ff" stroke-width="2"/>
    <path d="M100 86 l-4 -14 l4 -12 l4 12 Z" fill="#19e6ff"/>
    <rect x="95" y="104" width="10" height="3" fill="#19e6ff"/>
    <path d="M220 150 l-7 -36 l7 -18 l7 18 l-7 36" fill="#1a1d2c" stroke="#ff2bd6" stroke-width="2"/>
    <circle cx="220" cy="92" r="7" fill="#1a1d2c" stroke="#ff2bd6" stroke-width="2"/>
    <path d="M206 118 l-10 26 M234 118 l10 26" stroke="#ff7be8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="160" y="38" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-weight="900" font-size="30" fill="#fff" filter="url(#glow)">NEON CHESS</text>
</svg>
